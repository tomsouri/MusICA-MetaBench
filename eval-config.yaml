# Configuration for LLM Benchmark run

verbose: false

# If seed is set to an integer, it will be included in the payload sent to the model (if supported by the model) to ensure reproducibility (or at least try for as reproducibility as possible, given the inherent non-determinism of LLMs).
# If set to null or not included, no seed will be used and the inference will be non-deterministic.
seed: 42

benchmark_file: "benchmark_v1.tsv" # Path to the benchmark file generated by generate_benchmark.py, used for running LLMs on it. Can be overridden by command line argument --benchmark_file
models:
  # - "google/gemini-3.1-pro-preview"
  # - "google/gemini-3.1-flash-lite-preview"
  # - "llama-4-scout-17b-16e-instruct"
  # - "openai/gpt-4o-audio-preview"
  # - "openai/gpt-4o-mini"
  # - "google/gemini-2.5-flash"
  # - "google/gemini-2.0-flash-lite-001"

supported_aggregate_models:
  aggregate-gpt-4o:
      audio: "openai/gpt-4o-audio-preview"
      symbolic: "openai/gpt-4o"
      visual: "openai/gpt-4o"
  aggregate-gpt-5:
      audio: "openai/gpt-audio-mini"
      symbolic: "openai/gpt-5-image-mini"
      visual: "openai/gpt-5-image-mini"
  aggregate-mistral:
      audio: "mistralai/voxtral-small-24b-2507"
      symbolic: "mistralai/mistral-small-3.2-24b-instruct"
      visual: "mistralai/mistral-small-3.2-24b-instruct"


# gpt-5 (less costly):
#   +   openai/gpt-audio-mini
#   +   openai/gpt-5-image-mini
# gpt-4o (costly):
#   -   openai/gpt-4o-audio-preview
#   -   openai/gpt-4o
# mistral (costly)
#   +   mistralai/voxtral-small-24b-2507
#   +   mistralai/mistral-small-3.2-24b-instruct

url: "https://openrouter.ai/api/v1/chat/completions"
env_api_key_name: "OPENROUTER_API_KEY"


max_waiting_time_per_request: 300 # in seconds, after which the request will be considered failed and logged as such

# Zero Data Retention: route requests only to ZDR endpoints. Can be overridden by command line argument --disable_zdr
# Before running, every model is checked for an available ZDR endpoint, and the run stops with an error if a model has none.
zdr: true
turn_zdr_off_if_no_zdr_endpoint_available: false # If true, a model without a ZDR endpoint does not stop the run, ZDR gets turned off for that model only.


# Filter benchmark items by any column. Only items with the specified values will be processed.
# Leave as an empty list (or remove) to process all items.
# ==========================================
# FILTERING
# Leave lists empty to skip filtering for that category.
# ==========================================

filters:
  modality: 
    - "audio"
    - "symbolic"
    - "visual"
  # You can add any generic column here, e.g.:
  # question_type:
  #   - "pitch_identification"



# ==========================================
# EVALUATION CRITERIA
# Columns to group the final statistics by
# ==========================================
evaluation_criteria:
  - "submodality"
  - "piece_id"
  - "is_nota_correct"
  - "meta-question_id"
  - "category"
  - "subcategory"
  - "skill"
  - "rel/abs"
  - "specification"

# Specify where to save the tabular evaluation summary
evaluation_output_file: "evaluation_summary.tsv"




# If true, nothing is sent to the models.
dry_run: false


# If true, the model will not receive the actual content file (musical material) and will have
# to rely solely on the question and options text. To be used as a baseline to evaluate how well the model can guess the
# correct answer without seeing the musical material.
text_only_baseline: false

white_noise_baseline: false # If true, the model will receive white noise as the content file (instead of the actual musical material). To be used as a baseline to evaluate how well the model can guess the correct answer when the content is completely uninformative.



logdir: "logs"

# benchmark_file: "data/sample_benchmark.tsv" # Used if --output is not specified

# Extraction configuration
# path_to_extraction_file: "src/extraction_methods.py"
# extraction_method: "regex_final_answer_extractor"
path_to_extraction_file: "src/mmmu_eval_utils.py"
extraction_method: "parse_multi_choice_response"

system_prompt: 


# Formatting instructions adopted from MMMU-Pro: https://github.com/MMMU-Benchmark/MMMU/blob/main/mmmu-pro/prompts.yaml
user_prompt_template: |
  You are a specialist in the analysis and interpretation of musical materials. You are provided with a musical work as <FORMAT>. Analyze the material carefully. Then, given a question and a set of options, choose the most appropriate option.
  Question:
  <QUESTION>
  Options:
  <OPTIONS_TEXT>

  <POTENTIAL_TEXTFILE_PLACEHOLDER>

  Answer with the option letter from the given choices. The last line of your response should be of the following format: 'Answer: $LETTER' (without quotes) where LETTER is one of options.

musical_piece_format_info:
  audio:
    audio.mastermix.wav: "an audio recording (WAV format)"
  visual:
    visual.png: "a rendered score (PNG format)"
    visual.short.png: "a rendered score (PNG format)"
    visual.pdf: "a rendered score (PDF format)"
  symbolic:
    symbolic.musicxml: "a musical score (MusicXML format)"
    symbolic.abc.txt: "a musical score (ABC notation format)"
    symbolic.midi: "a musical score (MIDI format represented as CSV)"
    symbolic.abc: "a musical score (ABC notation format)"

# Google Sheets Logging
log_to_google_sheet: false # Whether to log the results to a Google Sheet. If true, the following Google Sheets configuration will be used.
sheet_id: "xxxx"
sheet_name: "original-do-not-modify-nor-hide-columns"
credentials_location: "<path-to-credentials>.json"
force_header_print: false